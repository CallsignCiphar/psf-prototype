<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5.2 Two-factor challenge | PSF prototype</title>
<link rel="icon" type="image/png" href="psf-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF9F4}
a{color:#04411F}a:hover{color:#03361A}
.psf{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#14171A;-webkit-font-smoothing:antialiased}
.psf *{box-sizing:border-box}
.sf{font-family:'Source Serif 4',Georgia,'Times New Roman',serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:2px;font:500 15px/1 'Inter',sans-serif;text-decoration:none;border:1px solid transparent;white-space:nowrap;cursor:pointer;background:none}
.btn-p{background:#04411F;color:#FFFFFF}
.otp{width:56px;height:64px;border:1px solid #7A8189;border-radius:2px;background:#FFFFFF;text-align:center;font:500 28px 'Inter',sans-serif;color:#14171A;font-variant-numeric:tabular-nums}
.inp{height:44px;border:1px solid #7A8189;border-radius:2px;background:#FFFFFF;padding:0 12px;font:15px 'Inter',sans-serif;color:#14171A;width:100%;letter-spacing:.1em}
</style>
<style>
.psf-proto-nav{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 32px);padding:8px;background:#14171A;border-radius:4px;box-shadow:0 8px 24px rgba(20,23,26,.24);font:500 13px/1 Inter,system-ui,sans-serif}
.psf-proto-nav a{color:#FFFFFF;text-decoration:none;padding:8px 10px;border-radius:2px}
.psf-proto-nav a:hover{background:#2E3338}
.psf-proto-nav a[aria-current]{background:#FFFFFF;color:#14171A}
.psf-proto-nav span{color:#BBC0C4;padding:0 4px 0 8px}
</style>
</head>
<body>

<div class="psf" style="width: 100%; min-height: 900px; background: #FBF9F4; display: flex; flex-direction: column; align-items: center; padding: 48px 32px 32px 32px; gap: 32px">
  <a href="Main.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #14171A"><img src="psf-logo.png" alt="" style="width: 44px; height: 44px; object-fit: contain; flex: none"><span class="sf" style="font-size: 19px; font-weight: 600">Pakistan Strategic Forum</span></a>
  <main style="width: 100%; max-width: 628px; background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 4px; padding: 48px; display: flex; flex-direction: column; gap: 22px">
    <h1 class="sf" style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 600">Enter your code</h1>
    
      <fieldset style="border: 0; padding: 0; margin: 0"><legend style="font-size: 15px; color: #2E3338; margin-bottom: 12px">Open your authenticator app and enter the 6-digit code for PSF.</legend>
        <div style="display: flex; gap: 10px"><input class="otp" aria-label="Digit 1" maxlength="1" value="3"><input class="otp" aria-label="Digit 2" maxlength="1" value="9"><input class="otp" aria-label="Digit 3" maxlength="1"><input class="otp" aria-label="Digit 4" maxlength="1"><input class="otp" aria-label="Digit 5" maxlength="1"><input class="otp" aria-label="Digit 6" maxlength="1"></div>
      </fieldset>
    
    
    <a class="btn btn-p" href="PortalOverview.html" style="width: 100%">Verify</a>
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500"><a href="#">Use a backup code instead</a><a href="SignIn.html">Back to sign in</a></div>
  </main>
  <p style="margin: auto 0 0 0; font-size: 13px; color: #5A6169">© 2019 to 2026 Pakistan Strategic Forum</p>
</div>

<nav class="psf-proto-nav" aria-label="Prototype"><a href="index.html">All screens</a><span>mode:</span><a href="TwoFactor.html" aria-current="page">totp</a><a href="TwoFactor--mode-backup.html">backup</a></nav>

</html>
