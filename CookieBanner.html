<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global: Cookie banner | PSF prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#04411F}
.psf{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#14171A;-webkit-font-smoothing:antialiased}
.psf *{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:180px;padding:0 18px;border-radius:2px;font:500 15px/1 'Inter',sans-serif;border:1px solid #14171A;background:#FFFFFF;color:#14171A;cursor:pointer}
</style>
<style>
.psf-proto-nav{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 32px);padding:8px;background:#14171A;border-radius:4px;box-shadow:0 8px 24px rgba(20,23,26,.24);font:500 13px/1 Inter,system-ui,sans-serif}
.psf-proto-nav a{color:#FFFFFF;text-decoration:none;padding:8px 10px;border-radius:2px}
.psf-proto-nav a:hover{background:#2E3338}
.psf-proto-nav a[aria-current]{background:#FFFFFF;color:#14171A}
.psf-proto-nav span{color:#BBC0C4;padding:0 4px 0 8px}
</style>
</head>
<body>

<div class="psf" role="region" aria-label="Cookie consent" style="width: 100%; background: #FFFFFF; border-top: 1px solid #E4E2DC; box-shadow: 0 -8px 24px rgba(20,23,26,.08)">
  <div style="max-width: 1280px; margin: 0 auto; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; box-sizing: content-box">
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #2E3338; max-width: 640px">We use essential cookies to run the site. With your permission we also use analytics cookies and load X, Instagram and YouTube content. <a href="Cookies.html">Cookie Policy</a></p>
    <div role="group" aria-label="Cookie choices" style="display: flex; gap: 10px"><button class="btn">Accept all</button><button class="btn">Reject non-essential</button><button class="btn">Settings</button></div>
  </div>
</div>

<nav class="psf-proto-nav" aria-label="Prototype"><a href="index.html">All screens</a></nav>
</body>
</html>
