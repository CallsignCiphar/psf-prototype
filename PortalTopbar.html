<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Portal: Top bar | PSF prototype</title>
<link rel="icon" type="image/png" href="psf-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<style>
.psf-proto-nav{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 32px);padding:8px;background:#14171A;border-radius:4px;box-shadow:0 8px 24px rgba(20,23,26,.24);font:500 13px/1 Inter,system-ui,sans-serif}
.psf-proto-nav a{color:#FFFFFF;text-decoration:none;padding:8px 10px;border-radius:2px}
.psf-proto-nav a:hover{background:#2E3338}
.psf-proto-nav a[aria-current]{background:#FFFFFF;color:#14171A}

</style>
</head>
<body>

<div style="width: 100%; height: 64px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E2DC; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-family: 'Inter', system-ui, sans-serif; color: #14171A">
  <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600">Overview</h1>
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="display: flex">
      <a href="ArticleEditor.html" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; background: #04411F; color: #FFFFFF; border-radius: 2px 0 0 2px; font: 500 15px 'Inter', sans-serif; text-decoration: none"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Write article</a>
      <button aria-label="More: Write report, Submit research" style="width: 36px; height: 40px; border: 0; border-left: 1px solid #0D6634; background: #04411F; color: #FFFFFF; border-radius: 0 2px 2px 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <a href="PortalNotifications.html" aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative; color: #2E3338"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg><span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; background: #A4231A; color: #FFFFFF; font-size: 10px; font-weight: 600; border-radius: 8px; display: flex; align-items: center; justify-content: center">3</span></a>
    <button aria-label="Account menu" style="display: flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0 4px; height: 44px; color: #2E3338; cursor: pointer"><span style="width: 32px; height: 32px; border-radius: 50%; background: #F5F1E8; border: 1px solid #E9E3D5; display: flex; align-items: center; justify-content: center; font: 600 12px 'Inter', sans-serif; color: #2E3338">SH</span><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  </div>
</div>

<nav class="psf-proto-nav" aria-label="Prototype"><a href="index.html">All screens</a></nav>
