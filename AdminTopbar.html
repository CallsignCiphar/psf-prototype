<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin: Top bar | PSF prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<style>
.psf-proto-nav{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 32px);padding:8px;background:#14171A;border-radius:4px;box-shadow:0 8px 24px rgba(20,23,26,.24);font:500 13px/1 Inter,system-ui,sans-serif}
.psf-proto-nav a{color:#FFFFFF;text-decoration:none;padding:8px 10px;border-radius:2px}
.psf-proto-nav a:hover{background:#2E3338}
.psf-proto-nav a[aria-current]{background:#FFFFFF;color:#14171A}
.psf-proto-nav span{color:#BBC0C4;padding:0 4px 0 8px}
</style>
</head>
<body>

<div style="width: 100%; height: 64px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E2DC; padding: 0 28px; display: flex; align-items: center; gap: 16px; font-family: 'Inter', system-ui, sans-serif; color: #14171A">
  <div style="flex: 1 1 320px; max-width: 520px; position: relative">
    <label for="adm-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search admin</label>
    <input id="adm-q" placeholder="Search users, content, reference ID, campaigns, cards" style="width: 100%; height: 40px; box-sizing: border-box; border: 1px solid #E4E2DC; border-radius: 2px; background: #FBF9F4; padding: 0 12px 0 38px; font: 14px 'Inter', sans-serif; color: #14171A">
    <svg viewBox="0 0 24 24" style="position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; stroke: #5A6169; fill: none; stroke-width: 1.5; stroke-linecap: round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
  </div>
  <span style="flex: 1"></span>
  <button style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; background: #04411F; color: #FFFFFF; border: 0; border-radius: 2px; font: 500 14px 'Inter', sans-serif; cursor: pointer"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Create<svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  <button aria-label="Notifications, 9 or more unread" style="width: 44px; height: 44px; background: none; border: 0; position: relative; color: #2E3338; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg><span style="position: absolute; top: 6px; right: 4px; height: 16px; padding: 0 4px; background: #A4231A; color: #FFFFFF; font: 600 10px 'Inter', sans-serif; border-radius: 8px; display: flex; align-items: center">9+</span></button>
  <a href="AdminAccount.html" aria-label="Account menu" style="display: flex; align-items: center; gap: 4px; text-decoration: none; color: #2E3338"><span style="width: 32px; height: 32px; border-radius: 50%; background: #022C15; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">UT</span><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
</div>

<nav class="psf-proto-nav" aria-label="Prototype"><a href="index.html">All screens</a></nav>
</body>
</html>
